(function(){
  const KEY='incoex_21_demo_v2';
  function read(){try{return JSON.parse(localStorage.getItem(KEY))||{}}catch{return {}}}
  function write(p){const s={...read(),...p};try{localStorage.setItem(KEY,JSON.stringify(s))}catch{}return s}

  function nav(url){window.location.assign(url)}

  document.querySelectorAll('form[data-submit]').forEach(form=>{
    form.addEventListener('submit',function(event){
      event.preventDefault();
      const fd=new FormData();
      const id=name=>(form.querySelector('#'+name)?.value||'').trim();
      const email=id('email'),password=id('password');
      if(this.dataset.submit==='login'){
        if(!email||!password){notify('Ingresá tu correo y contraseña.');return}
        if(!/^\S+@\S+\.\S+$/.test(email)){notify('Escribí un correo válido.');return}
        write({email,name:read().name||email.split('@')[0],loggedIn:true});nav('03-inicio.html');
      }else if(this.dataset.submit==='register'){
        if(!id('name')||!email||!password){notify('Completá los campos obligatorios.');return}
        if(!/^\S+@\S+\.\S+$/.test(email)){notify('Escribí un correo válido.');return}
        if(password.length<6){notify('La contraseña debe tener al menos 6 caracteres.');return}
        if(password!==id('confirm')){notify('Las contraseñas no coinciden.');return}
        const terms=form.querySelector('[type=checkbox]');if(terms&&!terms.checked){notify('Aceptá los términos y condiciones.');return}
        write({name:id('name'),email,phone:id('phone'),department:form.querySelector('select')?.value||'Managua',loggedIn:true});nav('03-inicio.html');
      }
    });
  });
  function picker(which){
    const day=which==='pickupDay';const overlay=document.createElement('div');overlay.className='demo-modal-bg';
    const defaultDate=new Date().toISOString().slice(0,10);
    overlay.innerHTML='<div class="demo-modal" role="dialog" aria-modal="true"><h2>'+(day?'Elegir fecha':'Elegir hora')+'</h2><p>Esta selección se guardará para la solicitud de viaje.</p><input aria-label="'+(day?'Fecha':'Hora')+'" type="'+(day?'date':'time')+'" value="'+(day?defaultDate:'10:00')+'"><div class="row"><button class="btn ghost" type="button" data-cancel>Cancelar</button><button class="btn primary" type="button" data-accept>Guardar</button></div></div>';
    document.querySelector('.phone').append(overlay);
    overlay.querySelector('[data-cancel]').addEventListener('click',()=>overlay.remove());
    overlay.addEventListener('click',(e)=>{if(e.target===overlay)overlay.remove()});
    overlay.querySelector('[data-accept]').addEventListener('click',()=>{
      const value=overlay.querySelector('input').value;if(!value){notify('Elegí una opción');return}
      write({[which]:value});const chip=document.querySelector('[data-chip="'+which+'"][data-value="Elegir"]');if(chip){chip.textContent=value;chip.classList.add('active');chip.dataset.value=value}
      document.querySelectorAll('[data-chip="'+which+'"]').forEach(el=>{if(el!==chip)el.classList.remove('active')});
      overlay.remove();notify('Horario guardado')
    });
  }
  document.querySelectorAll('[data-chip="pickupDay"][data-value="Elegir"],[data-chip="pickupTime"][data-value="Elegir"]').forEach(chip=>chip.addEventListener('click',e=>{e.stopImmediatePropagation();picker(chip.dataset.chip)},true));
  // Insert more realistic per-vehicle demo amounts: Moto C$85 / Carro C$160.
  function fare(){const s=read(),isCarro=s.vehicle==='Carro';return isCarro?160:85}
  function applyFare(){const val=fare(),s=read();document.querySelectorAll('[data-price-total]').forEach(node=>node.textContent='C$ '+val.toFixed(2));document.querySelectorAll('[data-price-short]').forEach(node=>node.textContent='C$ '+val);document.querySelectorAll('[data-vehicle-name]').forEach(node=>node.textContent=s.vehicle||'Moto')}
  applyFare();
  document.querySelectorAll('[data-choice="vehicle"]').forEach(el=>el.addEventListener('click',()=>setTimeout(applyFare,0)));
  // Visual state persistence for period filters after navigating back.

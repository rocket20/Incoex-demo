</style></head><body><div class="phone conductor"><div class="status"><strong>9:41</strong><span>◕ ▰ ▰</span></div><main class="main tight"><div class="mapwrap"><div class="map huge" data-map-point><img class="map-img" src="assets/mapa-managua.png" alt="Mapa: añadí tu mapa aquí" onerror="this.remove()"><div class="maproads"><svg viewBox="0 0 360 400" preserveAspectRatio="none" aria-hidden="true"><path d="M-40 295 L58 258 L118 310 L175 253 L212 288 L352 232 L404 260" stroke="#36a8ff" stroke-width="5" fill="none" stroke-linecap="round"/><path d="M-40 65 Q95 120 150 35 T370 87 M-15 160 Q160 130 198 188 T374 165 M23 409 L97 15 M168 429 L248 -10 M312 415 L345 -7" stroke="#cce5dc" stroke-width="1.6" fill="none" opacity=".3"/></svg></div><span class="map-mark start">●</span><span class="map-mark end">◆</span><div class="map-source">MAPA REEMPLAZABLE · assets/mapa-managua.png</div></div><button class="mapaction" type="button" data-go="03-inicio.html">‹ Atrás</button></div><div class="sheet"><div class="grab"></div><div class="between"><strong style="font-size:12px">Conductor en camino</strong><span class="chip">Llega en 2 min</span></div><div class="loc-row "><span class="ico " data-icon="ubicacion" title="Ícono editable: assets/icons/ubicacion.svg"><span class="ico-fallback">◈</span><img src="assets/icons/ubicacion.svg" alt="" onerror="this.remove()"></span><div class="flex1"><strong>Recogida</strong><small><span data-bind="pickup">Metrocentro</span></small></div><span class="loc-value"></span></div><div class="loc-row "><span class="ico " data-icon="bandera" title="Ícono editable: assets/icons/bandera.svg"><span class="ico-fallback">◈</span><img src="assets/icons/bandera.svg" alt="" onerror="this.remove()"></span><div class="flex1"><strong>Destino</strong><small><span data-bind="destination">Galerías Santo Domingo</span></small></div><span class="loc-value"></span></div><div class="panel dark row"><div class="photo avatar" aria-label="Placeholder avatar-conductor"><div class="photo-guide"><span>Conductor</span><small>assets/avatar-conductor.png</small></div><img src="assets/avatar-conductor.png" alt="Conductor" onerror="this.remove()"></div><div class="flex1"><strong style="font-size:11px">Carlos Fernández</strong><small class="muted" style="display:block">Moto azul · ★ 4.9</small></div><button class="btn small ghost" data-action="contact">☎</button><button class="btn small primary" data-action="contact">✉</button></div><p class="small">Estado del viaje</p><div class="between"><span class="ico " data-icon="ubicacion" title="Ícono editable: assets/icons/ubicacion.svg"><span class="ico-fallback">●</span><img src="assets/icons/ubicacion.svg" alt="" onerror="this.remove()"></span><span class="ico " data-icon="moto" title="Ícono editable: assets/icons/moto.svg"><span class="ico-fallback">◈</span><img src="assets/icons/moto.svg" alt="" onerror="this.remove()"></span><span class="ico " data-icon="ruta" title="Ícono editable: assets/icons/ruta.svg"><span class="ico-fallback">⇢</span><img src="assets/icons/ruta.svg" alt="" onerror="this.remove()"></span><span class="ico " data-icon="bandera" title="Ícono editable: assets/icons/bandera.svg"><span class="ico-fallback">✓</span><img src="assets/icons/bandera.svg" alt="" onerror="this.remove()"></span></div><div class="between mini" style="margin:6px 0"><span>Asignado</span><span>En camino</span><span>En ruta</span><span>Entregado</span></div><button class="btn ghost small" type="button" data-action="focusmap">Ver recorrido</button>&nbsp;<button class="btn primary small" type="button" data-action="finish">Finalizar (demo)</button></div></main><div class="toast" id="toast" role="status" aria-live="polite"></div></div><script>/* Demo funcional local, sin APIs. En cada página está embebido este JavaScript. */
(()=>{
 const key='incoex_21_demo_v2';let memory={};const get=()=>{try{return JSON.parse(localStorage.getItem(key))||memory}catch(e){return memory}};
 const put=(field,value)=>{const obj=get();obj[field]=value;memory=obj;try{localStorage.setItem(key,JSON.stringify(obj))}catch(e){}return obj};
 const go=(file)=>{location.href=file};
 const toast=(message)=>{let t=document.querySelector('#toast');if(!t)return alert(message);t.textContent=message;t.classList.add('visible');clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>t.classList.remove('visible'),2600)};
 document.querySelectorAll('[data-go]').forEach(el=>el.addEventListener('click',()=>go(el.dataset.go)));
 document.querySelectorAll('[data-store]').forEach(el=>{const value=get()[el.dataset.store];if(value!==undefined)el.value=value;const save=()=>put(el.dataset.store,el.value);el.addEventListener('input',save);el.addEventListener('change',save)});
 document.querySelectorAll('[data-bind]').forEach(el=>{const val=get()[el.dataset.bind];if(val!==undefined && val!==null && val!=='')el.textContent=String(val)});
 document.querySelectorAll('[data-choice]').forEach(el=>{const field=el.dataset.choice;let current=get()[field];if(current===el.dataset.value){el.classList.add('chosen');el.setAttribute('aria-pressed','true')}el.addEventListener('click',()=>{document.querySelectorAll('[data-choice="'+field+'"]').forEach(v=>{v.classList.remove('chosen');v.setAttribute('aria-pressed','false')});el.classList.add('chosen');el.setAttribute('aria-pressed','true');put(field,el.dataset.value)})});
 document.querySelectorAll('[data-ride-filter]').forEach(el=>el.addEventListener('click',()=>{
 const value=el.dataset.rideFilter;
 document.querySelectorAll('[data-ride-filter]').forEach(btn=>btn.classList.toggle('active',btn===el));
 document.querySelectorAll('.ride-card').forEach(card=>{let visible=value==='all'||value==='week'||card.dataset.kind===value||card.dataset.state===value;card.style.display=visible?'block':'none'});
 }));
 document.querySelectorAll('[data-chip]').forEach(el=>{const field=el.dataset.chip;const value=el.dataset.value;if(get()[field]===value)el.classList.add('active');el.addEventListener('click',()=>{document.querySelectorAll('[data-chip="'+field+'"]').forEach(v=>v.classList.remove('active'));el.classList.add('active');put(field,value);
  if(field==='period'){
   const total=document.querySelector('#statsTotal'); if(total)total.textContent=({'Mes':'8,400','Semana':'2,100','Año':'97,500'})[value]||'8,400';
   const bars=document.querySelectorAll('.bar');bars.forEach((bar,i)=>bar.style.height=(value==='Semana'?[45,35,63,42,83,35,55]:value==='Año'?[25,63,48,85,47,90,69]:[32,54,42,95,61,80,45])[i]+'%');
  }
 })});
 document.querySelectorAll('[data-toggle]').forEach(el=>{const field=el.dataset.toggle;el.setAttribute('aria-pressed',String(!!get()[field]));el.addEventListener('click',()=>{const on=el.getAttribute('aria-pressed')!=='true';el.setAttribute('aria-pressed',String(on));put(field,on)})});
 document.querySelectorAll('[data-counter]').forEach(el=>el.addEventListener('click',()=>{let field=el.dataset.counter,num=Number(get()[field]||1)+Number(el.dataset.step);num=Math.min(8,Math.max(1,num));put(field,num);document.querySelectorAll('[data-num="'+field+'"]').forEach(out=>out.textContent=num)}));
 document.querySelectorAll('[data-num]').forEach(el=>el.textContent=get()[el.dataset.num]||1);
 document.querySelectorAll('[data-action]').forEach(el=>el.addEventListener('click',()=>{
  const action=el.dataset.action, st=get();
  if(action==='login'){const email=document.querySelector('#email')?.value,password=document.querySelector('#password')?.value;if(!email||!password){toast('Completá correo y contraseña');return}put('email',email);put('name',st.name||email.split('@')[0]);go('03-inicio.html')}
  else if(action==='register'){const name=document.querySelector('#name')?.value,email=document.querySelector('#email')?.value,password=document.querySelector('#password')?.value;if(!name||!email||!password){toast('Completá los campos obligatorios');return}put('name',name);put('email',email);go('03-inicio.html')}
  else if(action==='request'){put('rideState','Buscando');put('currentRide',{origin:st.pickup||'Metrocentro',destination:st.destination||'Galerías',vehicle:st.vehicle||'Moto',payment:st.payment||'Efectivo',status:'En curso'});go('14-buscando.html')}
  else if(action==='finish'){const obj=get();const ride=obj.currentRide||{};ride.status='Finalizado';put('currentRide',ride);put('rideState','Finalizado');go('16-viaje-finalizado.html')}
  else if(action==='rate'){let rating=Number(el.dataset.stars||5);put('rating',rating);document.querySelectorAll('.stars button').forEach(x=>x.classList.toggle('active',Number(x.dataset.stars)<=rating));toast('¡Gracias por tu calificación!')}
  else if(action==='cancel'){put('rideState','Cancelado');go('03-inicio.html')}
  else if(action==='logout'){try{localStorage.removeItem(key)}catch(e){}memory={};go('01-login.html')}
  else if(action==='showpass'){let p=document.querySelector('#password');if(p)p.type=p.type==='password'?'text':'password'}
  else if(action==='contact'){toast('Botón listo para conectar chat / llamada real')}
  else if(action==='notice'){toast('No tenés notificaciones nuevas en la demo')}
  else if(action==='help'){toast('Conectá aquí tu centro de soporte')}
  else if(action==='selectmap'){toast('Usá los campos de dirección para definir la ruta')}
  else if(action==='selectfile'){document.querySelector('#upload')?.click()}
  else if(action==='photo'){toast('Subí una imagen en assets/ y usá su ruta en el HTML')}
  else if(action==='clear'){document.querySelectorAll('[data-store="stop1"],[data-store="stop2"]').forEach(x=>{x.value='';put(x.dataset.store,'')});toast('Paradas eliminadas')}
  else if(action==='settings') {const box=document.querySelector('#settingsPanel');if(box){box.hidden=!box.hidden; if(!box.hidden)box.scrollIntoView({block:'nearest',behavior:'smooth'})}}
  else if(action==='saveprofile'){toast('Información guardada en este navegador')}
  else if(action==='togglefav'){el.classList.toggle('liked');toast(el.classList.contains('liked')?'Agregado a favoritos':'Quitado de favoritos')}
  else {toast('Interacción de ejemplo: conectala a tu backend')}
 }));
 document.querySelectorAll('form[data-submit]').forEach(form=>form.addEventListener('submit',e=>{e.preventDefault();document.querySelector('[data-action="'+form.dataset.submit+'"]')?.click()}));
 const upload=document.querySelector('#upload');if(upload)upload.addEventListener('change',()=>{const label=document.querySelector('#uploadlabel');if(label&&upload.files[0])label.textContent=upload.files[0].name});
 document.querySelectorAll('[data-map-point]').forEach(map=>map.addEventListener('click',e=>{if(e.target.closest('button'))return;let rect=map.getBoundingClientRect(),mark=map.querySelector('.map-mark.end');if(mark){mark.style.left=((e.clientX-rect.left)/rect.width*100)+'%';mark.style.top=((e.clientY-rect.top)/rect.height*100)+'%';toast('Marcador movido · mapa de demostración')}}));
})();</script><script>/* INCOEX V3: navegación y controles adicionales, demo sin servidor */
(function(){
  const KEY='incoex_21_demo_v2';
  function read(){try{return JSON.parse(localStorage.getItem(KEY))||{}}catch{return {}}}
  function write(p){const s={...read(),...p};try{localStorage.setItem(KEY,JSON.stringify(s))}catch{}return s}
  function notify(t){const node=document.getElementById('toast');if(!node){alert(t);return};node.textContent=t;node.classList.add('visible');setTimeout(()=>node.classList.remove('visible'),2600)}
  function nav(url){window.location.assign(url)}
  // Corregido: los formularios de la versión anterior no disparaban sus acciones.
  document.querySelectorAll('form[data-submit]').forEach(form=>{
    form.addEventListener('submit',function(event){
      event.preventDefault();
      const fd=new FormData();
      const id=name=>(form.querySelector('#'+name)?.value||'').trim();
      const email=id('email'),password=id('password');
      if(this.dataset.submit==='login'){
        if(!email||!password){notify('Ingresá tu correo y contraseña.');return}
        if(!/^\S+@\S+\.\S+$/.test(email)){notify('Escribí un correo válido.');return}
        write({email,name:read().name||email.split('@')[0],loggedIn:true});nav('03-inicio.html');
      }else if(this.dataset.submit==='register'){
        if(!id('name')||!email||!password){notify('Completá los campos obligatorios.');return}
        if(!/^\S+@\S+\.\S+$/.test(email)){notify('Escribí un correo válido.');return}
        if(password.length<6){notify('La contraseña debe tener al menos 6 caracteres.');return}
        if(password!==id('confirm')){notify('Las contraseñas no coinciden.');return}
        const terms=form.querySelector('[type=checkbox]');if(terms&&!terms.checked){notify('Aceptá los términos y condiciones.');return}
        write({name:id('name'),email,phone:id('phone'),department:form.querySelector('select')?.value||'Managua',loggedIn:true});nav('03-inicio.html');
      }
    });
  });
  function picker(which){
    const day=which==='pickupDay';const overlay=document.createElement('div');overlay.className='demo-modal-bg';
    const defaultDate=new Date().toISOString().slice(0,10);
    overlay.innerHTML='<div class="demo-modal" role="dialog" aria-modal="true"><h2>'+(day?'Elegir fecha':'Elegir hora')+'</h2><p>Esta selección se guardará para la solicitud de viaje.</p><input aria-label="'+(day?'Fecha':'Hora')+'" type="'+(day?'date':'time')+'" value="'+(day?defaultDate:'10:00')+'"><div class="row"><button class="btn ghost" type="button" data-cancel>Cancelar</button><button class="btn primary" type="button" data-accept>Guardar</button></div></div>';
    document.querySelector('.phone').append(overlay);
    overlay.querySelector('[data-cancel]').addEventListener('click',()=>overlay.remove());
    overlay.addEventListener('click',(e)=>{if(e.target===overlay)overlay.remove()});
    overlay.querySelector('[data-accept]').addEventListener('click',()=>{
      const value=overlay.querySelector('input').value;if(!value){notify('Elegí una opción');return}
      write({[which]:value});const chip=document.querySelector('[data-chip="'+which+'"][data-value="Elegir"]');if(chip){chip.textContent=value;chip.classList.add('active');chip.dataset.value=value}
      document.querySelectorAll('[data-chip="'+which+'"]').forEach(el=>{if(el!==chip)el.classList.remove('active')});
      overlay.remove();notify('Horario guardado')
    });
  }
  document.querySelectorAll('[data-chip="pickupDay"][data-value="Elegir"],[data-chip="pickupTime"][data-value="Elegir"]').forEach(chip=>chip.addEventListener('click',e=>{e.stopImmediatePropagation();picker(chip.dataset.chip)},true));
  // Insert more realistic per-vehicle demo amounts: Moto C$85 / Carro C$160.
  function fare(){const s=read(),isCarro=s.vehicle==='Carro';return isCarro?160:85}
  function applyFare(){const val=fare(),s=read();document.querySelectorAll('[data-price-total]').forEach(node=>node.textContent='C$ '+val.toFixed(2));document.querySelectorAll('[data-price-short]').forEach(node=>node.textContent='C$ '+val);document.querySelectorAll('[data-vehicle-name]').forEach(node=>node.textContent=s.vehicle||'Moto')}
  applyFare();
  document.querySelectorAll('[data-choice="vehicle"]').forEach(el=>el.addEventListener('click',()=>setTimeout(applyFare,0)));
  // Visual state persistence for period filters after navigating back.
  if(document.querySelector('#statsTotal')){const s=read();const value=s.period;const total=document.querySelector('#statsTotal');if(value&&total)total.textContent=({Mes:'8,400',Semana:'2,100',Año:'97,500'})[value]||'8,400'}
  // A static front-end cannot claim real GPS, payments, tracking or account login.
  const focus=document.querySelector('[data-action="focusmap"]');if(focus)focus.addEventListener('click',(e)=>{e.stopImmediatePropagation();const m=document.querySelector('.mapwrap');m?.scrollIntoView({behavior:'smooth',block:'start'});notify('Visualización de ruta de demostración')},true);
})();</script></body></html>

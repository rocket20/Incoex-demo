<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#001a61">
  <title>Inicio del cliente | INCOEX</title>
  <style>
    /* =========================================================
       INCOEX · HOME CLIENTE
       Todo el HTML, CSS y JavaScript están en este archivo.

       PARA COLOCAR TUS VEHÍCULOS:
       Subí las imágenes a la misma carpeta que este HTML:
         moto.png     → tarjeta de Moto
         auto.png     → tarjeta de Auto
         carga.png    → tarjeta de Carga

       Las imágenes aparecen automáticamente. Mientras no existan,
       verás los placeholders SVG incorporados más abajo.
       Recomendado: PNG o WebP con fondo transparente.
       ========================================================= */
    :root { color-scheme:dark; font-family:Inter,"Segoe UI",Arial,sans-serif; }
    * { box-sizing:border-box; }
    html,body { margin:0; min-height:100%; }
    body { min-height:100dvh; display:flex; align-items:center; justify-content:center; background:#24262b; overflow:hidden; }
    button { font:inherit; color:inherit; border:0; cursor:pointer; -webkit-tap-highlight-color:transparent; }
    button:focus-visible { outline:2px solid #a2ddff; outline-offset:3px; }
    .app { position:relative; width:min(100vw,430px); height:100dvh; max-height:1000px; background:#001758; overflow:hidden; isolation:isolate; box-shadow:0 0 45px #0004; }
    .stage { position:absolute; left:50%; top:50%; width:333px; height:774px; transform:translate(-50%,-50%) scale(var(--scale,1)); transform-origin:center center; overflow:hidden; color:#fff; background:#001c62; }
    .backdrop { position:absolute; inset:0; display:block; width:100%; height:100%; z-index:-1; }
    .button-plain { background:transparent; padding:0; }
    .status {position:absolute; z-index:2; top:11px; left:27px; right:24px; height:18px; display:flex; justify-content:space-between; align-items:center; font-size:12px; font-weight:650; letter-spacing:-.2px;}
    .system-icons {display:flex;align-items:center;gap:3px;height:17px;}
    .system-icons svg {display:block;}
    .greeting {position:absolute;left:18px;top:48px;display:flex;flex-direction:column;gap:6px;}
    .greeting strong {font-size:14px;font-weight:780;letter-spacing:-.15px;line-height:18px;}
    .greeting span {font-size:10.5px;letter-spacing:-.15px;line-height:12px;color:#fff;}
    .user-actions {position:absolute;top:48px;right:18px;display:flex;align-items:center;gap:9px;}
    .bell {width:37px;height:37px;border-radius:50%; display:grid;place-items:center;background:linear-gradient(148deg,rgba(5,51,140,.95),rgba(0,29,91,.9));border:1px solid rgba(97,163,255,.19);box-shadow:0 3px 6px #0004, inset 0 1px 1px #ffffff25;}
    .bell:active, .avatar:active {transform:scale(.95)}
    .avatar {width:36px;height:36px;display:grid;place-items:center;border-radius:50%;background:radial-gradient(circle at 52% 27%,#657d8e 0%,#193c5d 50%,#031743 95%);border:2px solid rgba(201,225,250,.28);box-shadow:0 2px 10px #0006;overflow:hidden;}
    .avatar svg{width:28px;height:28px;margin-top:5px;opacity:.98;}
    .section-title {position:absolute;left:18px;top:99px;font-size:15px;font-weight:750;line-height:20px;letter-spacing:-.3px;margin:0;}

    .vehicle-card {position:absolute;border-radius:17px;overflow:hidden; padding:0; text-align:left; isolation:isolate;
      background:linear-gradient(138deg,rgba(1,14,63,.84) 0%,rgba(3,37,117,.70) 55%,rgba(0,20,66,.87) 100%);
      border:1px solid rgba(183,203,255,.18);
      box-shadow:inset 0 1px 1px #ffffff17, 0 6px 12px #0003; transition:filter .2s,transform .2s;}
    .vehicle-card:hover {filter:brightness(1.13);}
    .vehicle-card:active {transform:scale(.985);}
    .vehicle-card::before {content:"";position:absolute;z-index:-1;inset:0;background:radial-gradient(ellipse at 75% 65%,rgba(0,77,235,.11),transparent 65%);pointer-events:none;}
    .moto-card {left:18px;top:127px;width:144px;height:146px;}
    .auto-card {left:171px;top:127px;width:144px;height:146px;}
    .carga-card {left:18px;top:283px;width:297px;height:145px;}
    .vehicle-card .vehicle-slot {position:absolute;z-index:1;display:grid;place-items:center;}
    .moto-card .vehicle-slot {left:13px;right:13px;top:13px;height:93px;}
    .auto-card .vehicle-slot {left:9px;right:9px;top:15px;height:94px;}
    .carga-card .vehicle-slot {left:40px;right:40px;top:8px;height:93px;}
    .vehicle-image {display:block;position:absolute;inset:0;width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 8px 7px #00103e99);}
    .vehicle-image[hidden] {display:none;}
    .vehicle-empty {position:absolute;inset:6px 2px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:#c4ddff;opacity:.72;}
    .vehicle-empty svg {display:block;filter:drop-shadow(0 1px 8px #007aff55);}
    .vehicle-empty small {font-size:8px;letter-spacing:.1px;font-weight:500;color:#c5d9fa;white-space:nowrap;}
    .vehicle-image:not([hidden]) + .vehicle-empty {display:none;}
    .vehicle-copy {position:absolute;left:9px;bottom:12px;display:flex;flex-direction:column;gap:2px;z-index:2;}
    .vehicle-copy strong {font-size:11px;font-weight:750;line-height:14px;}
    .vehicle-copy span {font-size:9px;color:#d9e7ff;line-height:11px;white-space:nowrap;letter-spacing:-.15px;}
    .carga-card .vehicle-copy {left:9px;bottom:15px;}

    .quick-action {position:absolute;left:18px;width:297px;height:46px;border-radius:9px;padding:0 17px 0 24px;display:flex;align-items:center;gap:13px;text-align:left;
       background:linear-gradient(110deg,#0067f4 0%,#096cf9 56%,#137fff 100%);box-shadow:0 6px 16px #00124545,inset 0 1px 0 #ffffff13;
       font-size:10.25px;font-weight:730;letter-spacing:-.25px;transition:filter .2s,transform .2s;}
    .quick-action:hover {filter:brightness(1.12)}
    .quick-action:active{transform:scale(.988)}
    .quick-action span.label {flex:1;white-space:nowrap;}
    .quick-action .action-icon {width:16px;height:22px;flex:none;display:grid;place-items:center;}
    .quick-action .circle-arrow {width:29px;height:29px;border-radius:50%;display:grid;place-items:center;flex:none;
       background:linear-gradient(135deg,#f5ffff,#e6f4ff);color:#3f8aff;
       box-shadow:0 0 21px 7px #d4ebff6a,0 1px 4px #fff5;}
    .action-personal {top:436px;}
    .action-rental {top:491px;}

    .insurance {position:absolute;left:18px;top:545px;width:289px;height:132px;border-radius:19px;overflow:hidden;
       border:1px solid rgba(78,118,217,.22);
       background:linear-gradient(115deg,#041643 0%,#03184f 63%,#071c58 100%);
       box-shadow:0 8px 18px #0003,inset 0 1px 0 #ffffff05;}
    .insurance h2 {position:absolute;left:16px;top:18px;font-size:12.2px;line-height:12px;font-weight:760;letter-spacing:-.3px;margin:0;z-index:1;}
    .insurance p {position:absolute;left:16px;top:61px;width:133px;margin:0;font-size:8px;line-height:9px;font-weight:430;letter-spacing:-.08px;color:#e9f1ff;z-index:1;}
    .cover-button {position:absolute;left:16px;bottom:17px;width:120px;height:18px;border-radius:11px;background:#fff;color:#163d91;font-size:7.3px;font-weight:720;letter-spacing:-.23px;z-index:2;display:flex;align-items:center;justify-content:center;gap:5px;}
    .cover-button:active {transform:scale(.985)}
    .insurance-graphic {position:absolute;right:9px;top:23px;width:149px;height:91px;filter:drop-shadow(0 8px 8px #00114c);}

    .bottom-nav {position:absolute;left:18px;top:687px;width:297px;height:63px;border-radius:34px;
       border:1px solid rgba(175,204,255,.16);background:linear-gradient(175deg,rgba(6,39,105,.97) 0%,rgba(2,27,86,.97) 100%);
       box-shadow:0 6px 15px #0005,inset 0 1px 0 #ffffff14;display:flex;align-items:center;justify-content:space-between;padding:0 6px 0 0;}
    .nav-item {height:59px;width:61px;background:transparent;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:2px;font-weight:540;font-size:9px;letter-spacing:-.15px;border-radius:31px;}
    .nav-item svg {flex:0 0 auto;}
    .nav-item.active {height:61px;width:74px;flex:none;gap:1px;background:linear-gradient(150deg,rgba(197,218,255,.24),rgba(74,119,199,.25) 70%,rgba(148,179,237,.11));border:1px solid rgba(205,227,255,.35);box-shadow:0 3px 8px #00113a88,inset 0 1px 0 #fff4;}
    .nav-item.active .incoex-symbol {width:32px;height:29px;}
    .nav-item .nav-avatar {width:28px;height:28px;margin-bottom:1px;border-radius:50%;background:radial-gradient(circle at 50% 20%,#677e90,#19334e 64%,#092446);border:1px solid #83a1d12e;overflow:hidden;display:grid;place-items:center;}
    .nav-avatar svg {width:24px;height:27px;margin-top:7px;}
    .home-indicator {position:absolute;left:119px;bottom:5px;width:95px;height:4px;border-radius:5px;background:white;}

    .toast {position:absolute;z-index:15;left:25px;right:25px;bottom:94px;max-width:283px;margin:auto;text-align:center;
       background:rgba(1,24,71,.97);border:1px solid #459bff77;box-shadow:0 8px 24px #0008;
       border-radius:12px;padding:12px 13px;font-size:11px;line-height:1.4;opacity:0;transform:translateY(8px);pointer-events:none;transition:opacity .2s,transform .2s;}
    .toast.show {opacity:1;transform:translateY(0);}
    @media (min-width:500px) {.app {width:calc(min(95dvh,900px)*333/774);height:min(95dvh,900px);border:1px solid #142957;}}
    @media (prefers-reduced-motion:reduce) {*,*::before,*::after {transition:none!important;}}
  </style>
</head>
<body>
  <main class="app" id="app" aria-label="Pantalla de inicio del cliente INCOEX">
    <div class="stage" id="stage">
      <!-- Fondo abstracto de la marca: SVG vectorial editable, sin imágenes remotas -->
      <svg class="backdrop" viewBox="0 0 333 774" preserveAspectRatio="none" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="blueMain" x1="0" y1="0" x2=".85" y2="1">
            <stop offset="0" stop-color="#001344"/><stop offset=".26" stop-color="#0039a4"/><stop offset=".57" stop-color="#00338f"/><stop offset="1" stop-color="#00144b"/>
          </linearGradient>
          <radialGradient id="shineTop" cx="100%" cy="16%" r="84%"><stop stop-color="#005af7" stop-opacity=".85"/><stop offset=".50" stop-color="#0042ac" stop-opacity=".23"/><stop offset="1" stop-color="#003087" stop-opacity="0"/></radialGradient>
          <linearGradient id="glassA" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0452ff" stop-opacity=".85"/><stop offset=".47" stop-color="#076af9" stop-opacity=".43"/><stop offset="1" stop-color="#0049cb" stop-opacity=".12"/></linearGradient>
          <linearGradient id="glassB" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0e64ff" stop-opacity=".82"/><stop offset=".4" stop-color="#0b54db" stop-opacity=".7"/><stop offset="1" stop-color="#08368f" stop-opacity=".2"/></linearGradient>
          <linearGradient id="rightGlow" x1="0" y1=".65" x2="1" y2=".2"><stop stop-color="#0351d2" stop-opacity=".03"/><stop offset=".52" stop-color="#057aff" stop-opacity=".5"/><stop offset="1" stop-color="#8cdbff" stop-opacity=".95"/></linearGradient>
          <linearGradient id="bottomBlue" x1="0" y1="0" x2="1" y2=".7"><stop stop-color="#0254d9" stop-opacity=".8"/><stop offset=".64" stop-color="#0443a5" stop-opacity=".53"/><stop offset="1" stop-color="#042977" stop-opacity=".2"/></linearGradient>
          <filter id="blurGlow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="16"/></filter>
        </defs>
        <rect width="333" height="774" fill="url(#blueMain)"/>
        <rect width="333" height="774" fill="url(#shineTop)"/>
        <path d="M0 0H333V105C273 180 275 177 220 200L132 87H0Z" fill="#012266" opacity=".35"/>
        <!-- glass X strokes like the reference -->
        <path d="M135 87L210 87Q223 87 230 97L333 235V312Q320 338 300 313L189 153Q176 135 154 118Z" fill="url(#glassA)" opacity=".95"/>
        <path d="M333 91V208L236 339Q221 361 210 367L166 367 282 198Z" fill="url(#glassB)" opacity=".78"/>
        <path d="M333 95C308 123 281 165 258 203" stroke="url(#rightGlow)" stroke-width="3" fill="none"/>
        <path d="M333 93C316 113 304 132 290 155" stroke="#77d6ff" stroke-width="22" filter="url(#blurGlow)" opacity=".24" fill="none"/>
        <path d="M0 240L333 356V481L0 290Z" fill="#086aff" opacity=".2"/>
        <path d="M0 356L333 474V527L0 409Z" fill="#0066e6" opacity=".16"/>
        <path d="M0 471L333 623V697L0 571Z" fill="#0047b9" opacity=".35"/>
        <path d="M333 501L0 699V752L333 551Z" fill="#003890" opacity=".36"/>
        <path d="M0 516L333 649V690L0 558Z" fill="url(#bottomBlue)" opacity=".64"/>
        <path d="M0 579L333 724V774H290L0 644Z" fill="#00246c" opacity=".44"/>
        <path d="M0 687L219 774H100L0 737Z" fill="#0460d1" opacity=".42"/>
        <path d="M0 306C94 334 209 334 333 389" stroke="#0991ff" stroke-opacity=".24" stroke-width="2" fill="none"/>
        <path d="M333 256C277 312 298 339 333 356" stroke="#50b8ff" stroke-opacity=".3" stroke-width="1" fill="none"/>
      </svg>

      <!-- Barra de estado -->
      <div class="status" aria-label="Hora y estado de señal">
        <span>9:27</span>
        <div class="system-icons" aria-hidden="true">
          <svg width="18" height="14" viewBox="0 0 18 14"><path fill="white" d="M1 11h3v2H1zM5 8h3v5H5zM9 5h3v8H9zM13 2h3v11h-3z"/></svg>
          <svg width="15" height="14" viewBox="0 0 15 14" fill="none"><path d="M1 5c3.3-2.8 9.7-2.8 13 0M3.3 7.8c2-1.8 6.5-1.8 8.4 0M5.6 10.6c.85-.8 2.9-.8 3.8 0" stroke="white" stroke-width="1.55" stroke-linecap="round"/><circle cx="7.5" cy="12" r="1" fill="white"/></svg>
          <svg width="20" height="13" viewBox="0 0 20 13"><rect x=".5" y="2" width="16.5" height="9" rx="2" fill="none" stroke="#f9fafb" stroke-width="1.1"/><rect x="2.1" y="3.6" width="11" height="5.7" rx=".7" fill="#ffd83d"/><rect x="17.8" y="4.6" width="1.8" height="3.6" rx=".6" fill="#fff"/></svg>
        </div>
      </div>

      <div class="greeting">
        <strong>Hola, Mario Belfort</strong>
        <span>¡Buenos días!</span>
      </div>
      <div class="user-actions">
        <button class="bell" type="button" aria-label="Notificaciones" data-message="No tenés notificaciones nuevas.">
          <svg width="19" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9ZM10 20h4a2 2 0 0 1-4 0Z" fill="white"/></svg>
        </button>
        <button class="avatar" type="button" aria-label="Abrir perfil" data-message="Perfil del cliente: Mario Belfort">
          <svg viewBox="0 0 30 30" aria-hidden="true"><circle cx="15" cy="9" r="6" fill="#d3a68c"/><path d="M-2 31c1-14 8-16 17-16s16 2 17 16" fill="#1b253a"/><path d="M11 16l4 6 4-6" fill="#e3dfd6"/></svg>
        </button>
      </div>

      <h1 class="section-title">Envíos</h1>

      <!-- VEHÍCULOS: cambiá moto.png, auto.png y carga.png por tus imágenes.
           Si no existen, el navegador mostrará el placeholder vectorial. -->
      <button type="button" class="vehicle-card moto-card" aria-label="Envíos en moto" data-message="Envíos en Moto: ideales para paquetes pequeños.">
        <span class="vehicle-slot">
          <img class="vehicle-image" src="moto.png" alt="Motocicleta" hidden>
          <span class="vehicle-empty" aria-hidden="true">
            <svg width="101" height="62" viewBox="0 0 110 70" fill="none"><circle cx="27" cy="49" r="14" stroke="#8ec8ff" stroke-width="3"/><circle cx="83" cy="49" r="14" stroke="#8ec8ff" stroke-width="3"/><path d="M26 49l21-22 12 22H26l19-15 17 15h22L73 28H58M65 22h12M58 18l4 9" stroke="#80bcfa" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M33 29h12" stroke="#b4dcff" stroke-width="3" stroke-linecap="round"/></svg>
            <small>Agregar imagen de moto</small>
          </span>
        </span>
        <span class="vehicle-copy"><strong>Moto</strong><span>Envíos pequeños</span></span>
      </button>

      <button type="button" class="vehicle-card auto-card" aria-label="Envíos en auto" data-message="Envíos en Auto: espacios medianos.">
        <span class="vehicle-slot">
          <img class="vehicle-image" src="auto.png" alt="Automóvil" hidden>
          <span class="vehicle-empty" aria-hidden="true">
            <svg width="114" height="58" viewBox="0 0 120 60" fill="none"><path d="M9 32l10-14c3-5 11-6 19-6h43c9 0 12 5 19 16l13 5v14H8V36c0-2 0-3 1-4Z" stroke="#95cfff" stroke-width="2.7" stroke-linejoin="round"/><path d="M30 15l-10 17h78L84 15H30Z" fill="#3a86d7" fill-opacity=".18" stroke="#75b4fb" stroke-width="1.6"/><path d="M59 16v16" stroke="#95cfff" stroke-width="1.3"/><circle cx="30" cy="46" r="9" fill="#001e56" stroke="#8fcaff" stroke-width="3"/><circle cx="91" cy="46" r="9" fill="#001e56" stroke="#8fcaff" stroke-width="3"/></svg>
            <small>Agregar imagen de auto</small>
          </span>
        </span>
        <span class="vehicle-copy"><strong>Auto</strong><span>Espacios medianos</span></span>
      </button>

      <button type="button" class="vehicle-card carga-card" aria-label="Envíos de carga" data-message="Envíos de Carga: mayor espacio para todo tipo de envíos.">
        <span class="vehicle-slot">
          <img class="vehicle-image" src="carga.png" alt="Camión de carga" hidden>
          <span class="vehicle-empty" aria-hidden="true">
            <svg width="176" height="79" viewBox="0 0 190 84" fill="none"><path d="M10 13h113v52H10z" stroke="#88c7ff" stroke-width="2.5" fill="#3c91eb" fill-opacity=".11"/><path d="M123 28h26l25 23v14h-51V28Z" stroke="#89caff" stroke-width="2.7" stroke-linejoin="round" fill="#3c91eb" fill-opacity=".13"/><path d="M135 34h12l16 16h-28V34Z" fill="#4faafa" fill-opacity=".24" stroke="#88c7ff" stroke-width="1.5"/><path d="M22 17v45M42 17v45M62 17v45M82 17v45M102 17v45" stroke="#73aefe" stroke-opacity=".35"/><circle cx="49" cy="64" r="11" fill="#00255c" stroke="#9bcdff" stroke-width="3"/><circle cx="142" cy="64" r="11" fill="#00255c" stroke="#9bcdff" stroke-width="3"/></svg>
            <small>Agregar imagen de carga</small>
          </span>
        </span>
        <span class="vehicle-copy"><strong>Carga</strong><span>Mayor espacio para todo tipo de envíos</span></span>
      </button>

      <button class="quick-action action-personal" type="button" data-message="Próximamente: transporte para tu personal.">
        <span class="action-icon" aria-hidden="true"><svg width="21" height="23" viewBox="0 0 24 24" fill="white"><circle cx="14" cy="4.5" r="2.3"/><path d="M12 8l-3.3 3v4H6v-5l4.5-4H15l3 3-1.4 2-2.6-2 .3 4-3 4v5H8.7v-6.1l2.6-3.4-1.4-.9Z"/></svg></span>
        <span class="label">¿Necesitas movilizar a tu personal?</span>
        <span class="circle-arrow" aria-hidden="true"><svg width="16" height="16" viewBox="0 0 24 24"><path d="m9 5 7 7-7 7" fill="none" stroke="#3581ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
      </button>

      <button class="quick-action action-rental" type="button" data-message="Próximamente: INCOEX Rent a Car.">
        <span class="action-icon" aria-hidden="true"><svg width="22" height="19" viewBox="0 0 24 24" fill="none"><path d="M4 10 6 5h12l3 5M3 10h18v8H3v-8Z" stroke="white" stroke-width="1.75" stroke-linejoin="round"/><path d="M7 10h10" stroke="white" stroke-width="1.6"/><circle cx="7" cy="16" r="1.4" fill="white"/><circle cx="17" cy="16" r="1.4" fill="white"/><path d="M5 18v2M19 18v2" stroke="white" stroke-width="2"/></svg></span>
        <span class="label">¿Necesitas rentar un vehículo?</span>
        <span class="circle-arrow" aria-hidden="true"><svg width="16" height="16" viewBox="0 0 24 24"><path d="m9 5 7 7-7 7" fill="none" stroke="#3581ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
      </button>

      <section class="insurance" aria-label="Información sobre seguro de envíos">
        <h2>¿Sabes que<br>cubre el seguro<br>de tu envío?</h2>
        <p>Conoce la cobertura, sus límites<br>y qué hacer si ocurre un<br>incidente.</p>
        <button class="cover-button" type="button" data-message="Aquí podrás consultar la cobertura de tu seguro de envío.">Conocer mi cobertura <svg width="10" height="10" viewBox="0 0 24 24"><path d="m9 5 7 7-7 7" fill="none" stroke="#2053a5" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
        <!-- Ilustración de caja y escudo hecha en SVG, editable -->
        <svg class="insurance-graphic" viewBox="0 0 156 105" fill="none" aria-hidden="true">
          <defs>
            <linearGradient id="boxTop" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f2f7ff"/><stop offset="1" stop-color="#7caaf2"/></linearGradient>
            <linearGradient id="boxFront" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#e0edff"/><stop offset="1" stop-color="#6d9ddd"/></linearGradient>
            <linearGradient id="boxSide" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#4c82cf"/><stop offset="1" stop-color="#14438f"/></linearGradient>
            <linearGradient id="shieldG" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#70b3ff"/><stop offset=".5" stop-color="#2465d3"/><stop offset="1" stop-color="#14358f"/></linearGradient>
          </defs>
          <path d="M10 29 78 10l52 20-67 24Z" fill="url(#boxTop)"/>

  <script>
    /* Escala fiel a la captura (333 × 774), adaptada a la pantalla. */
    const app = document.getElementById('app');
    const stage = document.getElementById('stage');
    function fitScreen() {
      const scale = Math.min(app.clientWidth / 333, app.clientHeight / 774);
      stage.style.setProperty('--scale', String(scale));
    }
    window.addEventListener('resize', fitScreen);
    fitScreen();

    /* Los tres placeholders se sustituyen cuando añadís imágenes reales. */
    document.querySelectorAll('.vehicle-image').forEach(img => {
      function displayIfLoaded() { img.hidden = !(img.complete && img.naturalWidth > 0); }
      img.addEventListener('load', displayIfLoaded);
      img.addEventListener('error', () => img.hidden = true);
      displayIfLoaded();
    });

    const toast = document.getElementById('toast');
    let toastTimer;
    function notify(message) {
      clearTimeout(toastTimer);
      toast.textContent = message;
      toast.classList.add('show');
      toastTimer = setTimeout(() => toast.classList.remove('show'), 2800);
    }
    document.querySelectorAll('[data-message]').forEach(button => {
      button.addEventListener('click', () => notify(button.dataset.message));
    });
    document.querySelectorAll('[data-tab]').forEach(button => {
      button.addEventListener('click', () => {
        document.querySelectorAll('[data-tab]').forEach(tab => {
          tab.classList.remove('active'); tab.removeAttribute('aria-current');
        });
        button.classList.add('active');
        button.setAttribute('aria-current','page');
        if (button.dataset.tab !== 'Inicio') notify(`Apartado «${button.dataset.tab}» listo para conectar a su pantalla.`);
      });
    });
  </script>

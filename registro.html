    .dialog-box p{font-size:calc(var(--u)*10);line-height:1.5}
    .dialog-box button{
      font:inherit;font-size:calc(var(--u)*10);color:white;
      padding:calc(var(--u)*8) calc(var(--u)*28);
      background:#087cff;border:0;border-radius:calc(var(--u)*6);cursor:pointer;
    }
    @media (max-width:390px) {
      body{padding:0}
      .phone{width:100vw;min-height:100dvh;aspect-ratio:auto;background-size:100% 100%}
      /* Keep the original composition on narrow mobile screens. */
      .field {font-size:calc(var(--u)*8.2)}
    }
  </style>
</head>
<body>
  <main class="phone" aria-label="Registro de empresa de INCOEX">
    <button type="button" class="back" aria-label="Volver" onclick="history.back()"></button>
    <form id="companyForm" novalidate>
      <label class="sr-only" for="fullName">Nombre completo</label>
      <input class="field f1" id="fullName" name="fullName" placeholder="Nombre completo" autocomplete="name" required>

      <label class="sr-only" for="company">Nombre de la Empresa</label>
      <input class="field f2" id="company" name="company" placeholder="Nombre de la Empresa" autocomplete="organization" required>

      <label class="sr-only" for="idNumber">Número de Cédula</label>
      <input class="field f3" id="idNumber" name="idNumber" placeholder="Número de Cédula" required>

      <label class="sr-only" for="ruc">Número RUC</label>
      <input class="field f4" id="ruc" name="ruc" placeholder="Número RUC" required>

      <label class="sr-only" for="phone">Celular / WhatsApp</label>
      <input class="field f5" id="phone" name="phone" type="tel" placeholder="Celular / WhatsApp" autocomplete="tel" required>

      <label class="sr-only" for="email">Correo Electrónico</label>
      <input class="field f6" id="email" name="email" type="email" placeholder="Correo Electrónico" autocomplete="email" required>

      <label class="sr-only" for="password">Contraseña</label>
      <input class="field f7" id="password" name="password" type="password" minlength="8" placeholder="Contraseña" autocomplete="new-password" required>

      <input type="file" accept=".jpg,.jpeg,.png,.pdf,image/jpeg,image/png,application/pdf" id="documents" name="documents" class="sr-only" aria-label="Adjuntar Matrícula de la Alcaldía y Cédula RUC">
      <button type="button" class="upload-hit" id="uploadButton" aria-label="Adjuntar documentos: JPG, PNG o PDF, máximo 5 MB"></button>
      <div class="upload-result" id="uploadResult" aria-live="polite"></div>

      <label class="sr-only" for="terms">Acepto los Términos de Servicio y la Política de Privacidad</label>
      <input id="terms" class="terms-toggle" type="checkbox" required>
      <button type="button" class="terms-link tos" aria-label="Ver Términos de Servicio" data-modal="Términos de Servicio"></button>
      <button type="button" class="terms-link privacy" aria-label="Ver Política de Privacidad" data-modal="Política de Privacidad"></button>
      <button type="submit" class="submit" aria-label="Crear cuenta empresa"></button>
    </form>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <div class="dialog" id="dialog" role="dialog" aria-modal="true" aria-labelledby="dialogTitle">
      <div class="dialog-box">
        <strong id="dialogTitle"></strong>
        <p>Este enlace se podrá conectar con el documento oficial de INCOEX.</p>
        <button type="button" id="closeDialog">Entendido</button>
      </div>
    </div>
  </main>
  <script>
    const form = document.getElementById('companyForm');
    const fileInput = document.getElementById('documents');
    const uploadButton = document.getElementById('uploadButton');
    const uploadResult = document.getElementById('uploadResult');
    const toast = document.getElementById('toast');
    let toastTimer;

    function message(text){
      toast.textContent=text;toast.classList.add('visible');
      clearTimeout(toastTimer);
      toastTimer=setTimeout(()=>toast.classList.remove('visible'),4000);
    }
    function inspectFile(file){
      if(!file)return;
      const allowed=['image/jpeg','image/png','application/pdf'];
      if(!allowed.includes(file.type) && !/\.(jpe?g|png|pdf)$/i.test(file.name)){
        fileInput.value=''; uploadResult.classList.remove('visible');
        message('Formato no permitido. Adjuntá JPG, PNG o PDF.');return;
      }
      if(file.size>5*1024*1024){
        fileInput.value=''; uploadResult.classList.remove('visible');
        message('El documento no debe superar 5 MB.');return;
      }
      uploadResult.textContent='✓ Documento adjunto: '+file.name;
      uploadResult.classList.add('visible');
    }
    uploadButton.addEventListener('click',()=>fileInput.click());
    fileInput.addEventListener('change',()=>inspectFile(fileInput.files[0]));
    uploadButton.addEventListener('dragover',ev=>{ev.preventDefault();uploadButton.classList.add('dragging')});
    uploadButton.addEventListener('dragleave',()=>uploadButton.classList.remove('dragging'));
    uploadButton.addEventListener('drop',ev=>{
      ev.preventDefault();uploadButton.classList.remove('dragging');
      const files=ev.dataTransfer.files;
      if(files.length){try{fileInput.files=files;}catch{}inspectFile(files[0]);}
    });
    document.querySelectorAll('.field').forEach(el=>{
      el.addEventListener('input',()=>el.removeAttribute('aria-invalid'));
    });
    form.addEventListener('submit',ev=>{
      ev.preventDefault();
      const firstBad=[...form.querySelectorAll('.field')].find(input=>!input.checkValidity());
      if(firstBad){
        firstBad.setAttribute('aria-invalid','true');firstBad.focus();
        message(firstBad.validity.valueMissing?'Completá todos los campos.':
          firstBad.type==='email'?'Ingresá un correo electrónico válido.':
          firstBad.type==='password'?'La contraseña debe tener al menos 8 caracteres.':
          'Revisá este campo.');return;
      }
      if(!fileInput.files.length){message('Adjuntá los documentos requeridos.');return;}
      if(!document.getElementById('terms').checked){message('Aceptá los términos para continuar.');return;}
      message('Datos validados. El registro está listo para conectar con el servidor de INCOEX.');
    });
    const dialog=document.getElementById('dialog');
    document.querySelectorAll('[data-modal]').forEach(el=>el.addEventListener('click',()=>{
      document.getElementById('dialogTitle').textContent=el.dataset.modal;
      dialog.classList.add('open'); document.getElementById('closeDialog').focus();
    }));
    document.getElementById('closeDialog').onclick=()=>dialog.classList.remove('open');
    dialog.addEventListener('click',ev=>{if(ev.target===dialog)dialog.classList.remove('open')});
    document.addEventListener('keydown',ev=>{if(ev.key==='Escape')dialog.classList.remove('open')});
  </script>
</body>
</html>

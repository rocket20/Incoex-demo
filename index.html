      position: absolute;
      top: 54.45%;
      left: 8%;
      width: 84%;
      margin: 0;
      padding: 0;
      text-align: center;
      color: #fff;
      font-weight: 730;
      letter-spacing: -0.055cqw;
      font-size: 6.7cqw;

      text-shadow: 0 1px 1px rgb(0 0 0 / 5%);
    }
    .login-form { position: absolute; inset: 0; pointer-events: none; }
    .input-wrap {
      position: absolute;
      left: 13.2%;
      width: 76.25%;
      height: 4.45%;
      pointer-events: auto;
      overflow: hidden;
      border-radius: 100px;
      transition: box-shadow .2s, background .2s;
    }
    .input-wrap.email { top: 60.22%; }
    .input-wrap.password { top: 65.72%; }
    .input-wrap:focus-within {
      box-shadow: inset 0 0 0 1px rgb(147 199 255 / 55%), 0 0 0 2px rgb(13 128 255 / 7%);
      background: rgb(2 19 64 / 75%);
    }
    .field {
      width: 100%;
      height: 100%;
      display: block;
      border: 0;
      outline: 0;
      border-radius: inherit;
      background: transparent;
      color: white;
      padding: 0 6.5%;
      font: 400 2.82cqw/1.1 -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      letter-spacing: -0.025cqw;
      caret-color: #fff;
    }
    .field::placeholder { color: rgb(255 255 255 / 97%); opacity: 1; }
    .field:-webkit-autofill,
    .field:-webkit-autofill:hover,
    .field:-webkit-autofill:focus {
      -webkit-text-fill-color: #fff;
      box-shadow: 0 0 0 100px #071c4c inset;
      transition: background-color 99999s ease-out 0s;
    }
    .password .field { padding-right: 15%; }
    .toggle-password {
      position: absolute;
      top: 0;
      right: 4.6%;
      height: 100%;
      width: 12%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      background: none;
      border: 0;
      color: #fff;
      cursor: pointer;
    }
    .toggle-password svg { width: 4.2cqw; height: 4.2cqw; }
    .toggle-password:focus-visible,
    .submit:focus-visible, .signup a:focus-visible { outline: 2px solid #9be0ff; outline-offset: 2px; }
    .submit {
      position: absolute;
      top: 71.67%;
      left: 13.2%;
      width: 76.25%;
      height: 5.47%;
      pointer-events: auto;
      border: 0;
      border-radius: 2.35cqw;
      background: transparent;
      color: #fff;
      text-align: center;
      font-size: 2.85cqw;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: filter .15s, transform .15s;
    }
    .submit:hover { background: rgb(255 255 255 / 7%); }
    .submit:active { transform: scale(.99); }
    .signup {
      position: absolute;
      top: 80.00%;
      left: 0;
      width: 100%;
      margin: 0;
      font-size: 2.95cqw;
      text-align: center;
      line-height: 1.3;
      color: white;
      letter-spacing: -0.015cqw;
    }
    .signup a { color: white; text-decoration: underline; text-underline-offset: 1px; font-weight: 650; }
    .toast {
      position: absolute;
      bottom: 10%;
      left: 9%;
      width: 82%;
      background: rgb(3 19 58 / 92%);
      border: 1px solid rgb(132 207 255 / 30%);
      border-radius: 12px;
      box-shadow: 0 8px 25px rgb(0 0 0 / 25%);
      padding: 12px;
      font-size: clamp(11px, 3cqw, 14px);
      text-align: center;
      opacity: 0;
      visibility: hidden;
      transform: translateY(8px);
      transition: opacity .2s, transform .2s, visibility .2s;
      z-index: 5;
    }
    .toast.show { opacity: 1; visibility: visible; transform: translateY(0); }
    @media (max-width: 600px) {
      body { background: #041941; }
      .login-screen { box-shadow: none; }
    }

    /* ============================================
       ADAPTACIÓN RESPONSIVE PARA CELULAR
       Solo reglas CSS adicionales: no se altera
       el HTML, los estilos originales ni el JS.
       ============================================ */
    @media screen and (max-width: 600px) {
      html, body {
        width: 100%;
        overflow-x: hidden;
      }

      body {
        display: block;
        min-height: 100vh;
        min-height: 100dvh;
      }

      .login-screen {
        width: 100%;
        max-width: none;
        min-height: 100vh;
        min-height: 100dvh;
        margin-left: auto;
        margin-right: auto;
        box-shadow: none;
      }

      /* Evita que Safari haga zoom al tocar los campos. */
      .field {
        font-size: max(16px, 2.82cqw);
      }
    }

    /* En horizontal, conserva el diseño en formato vertical
       sin reducirlo a un tamaño diminuto. Se puede desplazar. */
    @media screen and (max-height: 500px) and (orientation: landscape) {
      body {
        display: flex;
        align-items: flex-start;
        justify-content: center;
      }
      .login-screen {
        width: min(100vw, 390px);
        min-height: 0;
      }
    }

<body>
  <main class="login-screen" aria-label="INCOEX, pantalla de inicio de sesión">
    <h1>Iniciar sesión</h1>

    <form class="login-form" id="loginForm" autocomplete="on">
      <div class="input-wrap email">
        <input class="field" type="email" name="email" id="email" placeholder="Correo"
               aria-label="Correo electrónico" autocomplete="email" required />
      </div>
      <div class="input-wrap password">
        <input class="field" type="password" name="password" id="password"
               placeholder="Contraseña" aria-label="Contraseña"
               autocomplete="current-password" required />
        <button class="toggle-password" type="button" aria-label="Mostrar contraseña" id="togglePassword">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M2 12s3.5-5.2 10-5.2S22 12 22 12s-3.5 5.2-10 5.2S2 12 2 12Z"/>
            <circle cx="12" cy="12" r="2.6"/>
          </svg>
        </button>
      </div>
      <button class="submit" type="submit">Iniciar sesión</button>
    </form>

    <p class="signup">¿No tienes cuenta? <a href="registro.html" id="registerLink">Regístrate aquí</a></p>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </main>

  <script>
    // Comportamientos de demostración; integra tu API de autenticación en submit.
    const password = document.getElementById('password');
    const toggle = document.getElementById('togglePassword');
    const toast = document.getElementById('toast');
    let dismiss;

    toggle.addEventListener('click', () => {
      const showing = password.type === 'text';
      password.type = showing ? 'password' : 'text';
      toggle.setAttribute('aria-label', showing ? 'Mostrar contraseña' : 'Ocultar contraseña');
      password.focus();
    });

    function showToast(message) {
      toast.textContent = message;
      toast.classList.add('show');
      clearTimeout(dismiss);
      dismiss = setTimeout(() => toast.classList.remove('show'), 3500);
    }

    document.getElementById('loginForm').addEventListener('submit', (event) => {
      event.preventDefault();
      showToast('Formulario listo: conecta aquí tu servicio de inicio de sesión.');
    });
    document.getElementById('registerLink').addEventListener('click', (event) => {
      event.preventDefault();
      showToast('Conecta aquí tu pantalla de registro.');
    });
  </script>
</body>
</html>

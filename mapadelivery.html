.route-card{position:absolute;top:19.7%;left:15px;right:15px;z-index:3;height:24.7%;border-radius:12px;background:linear-gradient(100deg,#0a304bfa 0%,#081846fa 58%,#081943fa 100%);border:1px solid #365477b3;box-shadow:0 6px 9px #0613288c;display:flex;flex-direction:column;padding:7px 8px 7px 7px}
.route-card::before{content:"";position:absolute;width:2px;height:44px;background:#0f88ff;left:20px;top:22px}
.address-row{display:flex;align-items:center;gap:8px;min-height:39px;position:relative}
.address-row--origin{min-height:41px;}
.address-row--destination{min-height:33px;}
.route-icon{width:25px;height:25px;flex:0 0 25px;border-radius:50%;display:grid;place-items:center;background:#137efe;box-shadow:0 0 0 2px #168bff33;z-index:2}
.route-icon svg{height:15px;width:15px;fill:#fff;stroke:#fff;stroke-width:1.2}
.address-copy{min-width:0;flex:1}
.address-title{font-size:10px;font-weight:750;line-height:1.15}
.address-primary{font-size:9px;font-weight:660;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.36}
.address-secondary{font-size:8.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.2;color:#d3e1ff}
.route-divider{height:1px;background:#547593b7;margin:0 0 0 37px}
.mini-btn{flex:0 0 auto;min-width:58px;border-radius:20px;border:1px solid #4c669c;background:#182d58;color:#fff;font-size:9px;font-weight:650;padding:5px 9px;display:flex;align-items:center;justify-content:center;gap:5px}
.mini-btn svg{width:10px;height:10px}
.mini-btn.fill{background:#127cfa;border-color:#147dff;min-width:62px}
/* Bottom sheet */
.sheet{position:relative;flex:0 0 auto;width:100%;height:228px;border-radius:19px 19px 0 0;margin-top:-8px;padding:15px 18px 26px;background:linear-gradient(120deg,rgba(6,37,54,.98),rgba(9,43,62,.98));border-top:1px solid #27536d;box-shadow:0 -7px 18px #051b3480;z-index:5;display:flex;flex-direction:column}
.sheet::before{content:"";position:absolute;inset:0;pointer-events:none;border-radius:inherit;background:radial-gradient(ellipse at 66% 20%,#1642684a 0%,transparent 60%)}
.sheet>*{position:relative;z-index:1}
.sheet-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;min-height:18px}
.sheet-title{margin:0;font-size:13px;line-height:1.2;font-weight:750}
.program-btn{background:#147dff;color:white;border:0;border-radius:16px;padding:4px 16px;font-size:10px;line-height:1.3;font-weight:650;min-width:78px}
.tabs{display:flex;gap:4px;margin-bottom:9px}
.tab{min-width:56px;height:21px;border:1px solid #22445b;background:#082339;border-radius:13px;color:#cdd8e8;font-size:10px;font-weight:550;padding:0 14px}
.tab[aria-selected="true"]{background:#137dff;border-color:#137dff;color:white;font-weight:700}
.vehicle-list{display:flex;gap:8px;margin:0;align-items:stretch;min-height:85px}
.vehicle-card{position:relative;width:74px;min-width:74px;height:84px;display:flex;flex-direction:column;align-items:flex-start;justify-content:flex-end;text-align:left;color:white;padding:5px 7px 8px;border-radius:15px;border:1px solid #28507091;overflow:hidden;background:linear-gradient(160deg,#09253c,#0c3048);box-shadow:0 3px 8px #0002;transition:border-color .15s,transform .15s}
.vehicle-card:before{content:"";position:absolute;inset:0;opacity:.4;background:radial-gradient(ellipse at 50% 30%,#17476a,transparent 70%);pointer-events:none}
.vehicle-card[aria-pressed="true"]{border-color:#1489ff;box-shadow:0 0 0 1px #147dfc60,inset 0 0 12px #147dfc11}
.vehicle-card:active{transform:scale(.97)}
.vehicle-card img{position:absolute;top:7px;left:4px;width:calc(100% - 8px);height:46px;object-fit:contain;mix-blend-mode:screen;filter:saturate(1.3) contrast(1.08)}
.vehicle-name{position:relative;font-size:9px;font-weight:650;line-height:1.07}
.vehicle-price{position:relative;font-size:9px;line-height:1.13;font-weight:750}
.cta{margin-top:9px;height:34px;min-height:34px;width:100%;display:flex;align-items:center;justify-content:center;background:#137bfd;border:none;border-radius:8px;color:white;font-weight:750;font-size:10px;box-shadow:0 4px 12px #085bcb44}
.home-indicator{position:absolute;bottom:6px;left:50%;transform:translateX(-50%);width:80px;height:4px;background:#f8faff;border-radius:12px;opacity:.92;z-index:2}
/* Modal actions for prototype usability */
.dialog-backdrop{position:fixed;inset:0;z-index:20;background:#000a;display:none;place-items:end center;padding:20px}
.dialog-backdrop.open{display:grid}
.dialog{background:#091e3c;border:1px solid #37587e;width:min(100%,440px);border-radius:20px;padding:22px;box-shadow:0 20px 80px #0008;color:#fff}
.dialog-title{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;gap:10px;font-size:18px;font-weight:700}
.close{border:1px solid #3a547a;color:white;background:#112c50;border-radius:10px;padding:7px 11px}
.field{display:flex;flex-direction:column;gap:6px;margin:12px 0;font-size:12px;color:#dce9fc}
.field input,.field select{width:100%;border-radius:10px;padding:12px;background:#0e3056;border:1px solid #3b6287;color:#fff;font-size:16px;min-height:44px}
.dialog-submit{width:100%;margin-top:13px;border:none;border-radius:11px;background:#137dff;color:white;font-size:14px;padding:13px;font-weight:700}
.toast{position:fixed;left:50%;bottom:32px;transform:translateX(-50%);padding:12px 18px;background:#183b68;border:1px solid #4388be;border-radius:12px;z-index:100;color:#fff;font-size:13px;max-width:calc(100vw - 40px);display:none;text-align:center;box-shadow:0 8px 20px #0009}
.toast.show{display:block}
/* Responsive behavior — geometry adapts while preserving reference styling */
@media(min-width:340px){
.preview-heading{font-size:22px}
.sheet{height:292px;padding:21px 20px 34px;border-radius:23px 23px 0 0}
.sheet-title{font-size:16px}
.program-btn{font-size:12px;min-width:100px;padding:6px 17px}
.sheet-head{margin-bottom:11px}
.tabs{margin-bottom:12px;gap:6px}
.tab{height:28px;min-width:77px;font-size:12px}
.vehicle-list{gap:11px;min-height:105px}
.vehicle-card{height:105px;width:108px;min-width:108px;padding:7px 9px 10px;border-radius:17px}
.vehicle-card img{height:65px;top:5px}
.vehicle-name,.vehicle-price{font-size:12px}
.cta{margin-top:12px;height:43px;font-size:12px;border-radius:9px}
.home-indicator{width:105px;bottom:9px}
.route-card{height:24.7%;top:19.7%;left:21px;right:21px;padding:9px 12px}
.route-card::before{left:25px;top:28px;height:57px}
.address-row--origin{min-height:54px}.address-row--destination{min-height:42px}
.route-icon{height:32px;width:32px;flex-basis:32px}.route-icon svg{height:19px;width:19px}
.address-title{font-size:12px}.address-primary{font-size:11px}.address-secondary{font-size:10px}
.route-divider{margin-left:41px}
.mini-btn{font-size:11px;padding:6px 12px;min-width:68px}.mini-btn.fill{min-width:79px}
.back-home{top:10.3%;left:20px;height:37px;font-size:12px;padding:0 21px 0 15px}
.status-bar{font-size:13px;height:41px;padding-left:31px;padding-right:30px}
}
@media(min-width:420px){
.sheet{height:315px;padding:24px 25px 38px}
.vehicle-card{height:112px;width:118px;min-width:118px}
.vehicle-card img{height:72px}
.cta{height:47px}
}
@media(max-height:690px) and (min-width:340px){.sheet{height:276px;padding-top:15px}.vehicle-list{min-height:99px}.vehicle-card{height:99px}.sheet-head{margin-bottom:7px}.tabs{margin-bottom:8px}.cta{margin-top:9px}}
@media(max-height:720px) and (min-width:340px){
.route-card{padding:5px 9px}.route-card::before{left:22px;top:22px;height:43px}
.address-row--origin{min-height:39px}.address-row--destination{min-height:34px}
.route-icon{width:26px;height:26px;flex-basis:26px}.route-icon svg{width:16px;height:16px}
.address-title{font-size:10px}.address-primary{font-size:9px}.address-secondary{font-size:8.5px}
.route-divider{margin-left:35px}.mini-btn{font-size:9px;padding:5px 8px;min-width:54px}.mini-btn.fill{min-width:60px}
.back-home{height:30px;font-size:10px;padding-left:12px;padding-right:15px}
}
@media(max-width:310px){.sheet{padding-left:16px;padding-right:16px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{transition:none!important;animation:none!important}}

<div class="dialog-backdrop" id="dialogBackdrop" role="presentation">
  <section class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialogTitle">
    <div class="dialog-title"><span id="dialogTitle">Opciones</span><button class="close" id="dialogClose" aria-label="Cerrar" type="button">✕</button></div>
    <div id="dialogBody"></div>
  </section>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
(function(){
  const backdrop=document.getElementById('dialogBackdrop');
  const title=document.getElementById('dialogTitle');
  const body=document.getElementById('dialogBody');
  const toast=document.getElementById('toast');
  let currentService='Envíos', selectedVehicle='';
  const esc=(s)=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const notify=msg=>{toast.textContent=msg;toast.classList.add('show');clearTimeout(window._incoexToast);window._incoexToast=setTimeout(()=>toast.classList.remove('show'),2500)};
  const close=()=>{backdrop.classList.remove('open');body.innerHTML=''};
  const open=(heading,html,submit)=>{
    title.textContent=heading;body.innerHTML=html;backdrop.classList.add('open');
    const form=body.querySelector('form');if(form)form.addEventListener('submit',e=>{e.preventDefault();submit?.(new FormData(form));close()});
  };
  document.getElementById('dialogClose').addEventListener('click',close);
  backdrop.addEventListener('click',e=>{if(e.target===backdrop)close()});
  document.addEventListener('keydown',e=>{if(e.key==='Escape')close()});
  function switchTab(service){
    currentService=service;selectedVehicle='';
    document.getElementById('tabEnvios').setAttribute('aria-selected',String(service==='Envíos'));
    document.getElementById('tabViajes').setAttribute('aria-selected',String(service==='Viajes'));
    document.getElementById('serviceHeading').textContent=service;
    document.querySelectorAll('.vehicle-card').forEach(card=>card.setAttribute('aria-pressed','false'));
    document.getElementById('continueButton').textContent='Completar formulario de '+(service==='Viajes'?'Viaje':'Viaje');
  }
  document.getElementById('tabEnvios').addEventListener('click',()=>switchTab('Envíos'));
  document.getElementById('tabViajes').addEventListener('click',()=>switchTab('Viajes'));
  document.querySelectorAll('.vehicle-card').forEach(card=>card.addEventListener('click',()=>{
    selectedVehicle=card.dataset.vehicle;
    document.querySelectorAll('.vehicle-card').forEach(c=>c.setAttribute('aria-pressed',String(c===card)));
  }));
  document.querySelectorAll('[data-modal]').forEach(btn=>btn.addEventListener('click',()=>{
    switch(btn.dataset.modal){
      case 'edit':open('Editar origen',`<form><label class="field">Dirección de origen<input required name="address" value="${esc(document.getElementById('originAddress').textContent)}"></label><button class="dialog-submit">Guardar dirección</button></form>`,data=>{const v=String(data.get('address'));document.getElementById('originAddress').textContent=v;document.getElementById('originSub').textContent=v;notify('Origen actualizado')});break;
      case 'map':open('Destino final',`<form><label class="field">¿A dónde va tu pedido?<input name="destination" placeholder="Escribe la dirección de destino" required></label><button class="dialog-submit">Confirmar destino</button></form>`,data=>{document.getElementById('destinationText').textContent=String(data.get('destination'));notify('Destino seleccionado')});break;
      case 'schedule':open('Programar servicio',`<form><label class="field">Fecha de servicio<input type="date" required name="date"></label><label class="field">Hora<input type="time" name="time" required></label><button class="dialog-submit">Confirmar programación</button></form>`,data=>notify('Servicio programado para '+String(data.get('date'))+' a las '+String(data.get('time'))));break;
    }
  }));
  document.getElementById('continueButton').addEventListener('click',()=>{
    if(!selectedVehicle){notify('Selecciona Moto o Auto para continuar');return}
    open('Formulario de '+(currentService==='Envíos'?'envío':'viaje'),`<form><p style="color:#bfcde9;font-size:13px">Servicio: ${esc(currentService)} · ${esc(selectedVehicle)}</p><label class="field">Nombre<input name="name" required placeholder="Nombre completo"></label><label class="field">Teléfono<input type="tel" name="phone" required placeholder="Número de contacto"></label><label class="field">Notas<textarea style="min-height:70px;width:100%;background:#0e3056;border:1px solid #3b6287;border-radius:10px;color:white;padding:12px;font:inherit" name="notes" placeholder="Detalles adicionales (opcional)"></textarea></label><button class="dialog-submit">Continuar</button></form>`,()=>notify('Formulario completado'));
  });
  document.getElementById('homeButton').addEventListener('click',()=>{if(history.length>1)history.back();else notify('Estás en INCOEX')});
})();
</script>
</body>
</html>

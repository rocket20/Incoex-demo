olid #90d9ff;flex:none}.dot.end{background:#29e3a4;border-color:#baffdd}

t-weight:750;border-radius:9px;padding:9px 12px;white-space:nowrap;font-size:10px}.tab.on{background:#087cff;color:#fff;border-color:#087cff}.trip{display:flex;gap:12px;align-items:center;padding:12px;background:rgba(4,28,75,.72);border:1px solid var(--line);border-radius:12px;margin:9px 0;cursor:pointer}.trip h3{font-size:12px;margin:0 0 4px}.trip p{font-size:10px;color:var(--muted);margin:3px 0}.chart{height:105px;display:flex;align-items:flex-end;justify-content:space-around;border-bottom:1px solid var(--line);gap:11px}.chart i{flex:1;border-radius:5px 5px 0 0;background:linear-gradient(#14b1ff,#1261c1);height:var(--h)}.chart i:nth-child(2n){opacity:.7}.checkbox-row{display:flex;gap:10px;align-items:center;font-size:11px;color:#c8dffd;margin-top:15px}.checkbox-row input{accent-color:#168cff}.spinner{height:112px;width:112px;margin:28px auto;border-radius:50%;border:7px solid rgba(52,140,255,.2);border-top-color:#2cc0ff;animation:spin 1s linear infinite;display:grid;place-items:center;font-size:35px}.spinner .ico{animation:spin 1s linear infinite reverse}@keyframes spin{to{transform:rotate(360deg)}}.toast{position:absolute;bottom:152px;left:22px;right:22px;z-index:999;display:none;padding:12px 14px;border-radius:12px;background:#c7ebff;color:#072453;font-weight:700;font-size:12px;box-shadow:var(--shadow)}.toast.show{display:block}.progress{height:7px;background:rgba(67,137,231,.28);overflow:hidden;border-radius:30px}.progress b{display:block;background:linear-gradient(90deg,#0085ff,#59d3ff);height:100%;width:var(--w)}.hero-overline{text-align:center;letter-spacing:.08em;font-size:10px;color:#97ccff;margin-top:8px}.link{border:0;background:none;padding:0;color:#85caff;font-size:12px;font-weight:750}.welcome-copy{margin:6px 0 25px;text-align:center}.welcome-copy h1{font-size:23px;margin:8px 0}.welcome-copy p{font-size:12px;color:#aed7ff;margin:0}.empty{padding:23px 12px;text-align:center;color:#8fc7ff;font-size:12px;border:1px dashed var(--line);border-radius:12px} <main class="main scroll"><div class="kicker">EMPEZÁ CON INCOEX</div><h2 class="h1">Creá tu cuenta</h2><p class="muted">Completá tus datos para empezar a viajar.</p><div class="screen-steps"><i class="on"></i><i class="on"></i><i></i><i></i></div><form data-submit="register"><div class="field"><label for="nombre">Nombre completo</label><input id="nombre" data-save="nombre" type="text" placeholder="Tu nombre y apellido" required></div><div class="field"><label for="telefono">Número de teléfono</label><input id="telefono" data-save="telefono" type="tel" placeholder="+505 8888 8888" ></div><div class="field"><label>Correo electrónico</label><input type="email" id="correo" data-save="email" placeholder="correo@ejemplo.com" required></div><div class="field"><label>Contraseña</label><div class="input-icon"><input id="clave" type="password" placeholder="Mínimo 6 caracteres" required><button type="button" class="link" data-showpass="clave">Ver</button></div></div><div class="field"><label>Ciudad</label><select data-save="city"><option>Managua</option><option>Masaya</option><option>Granada</option><option>León</option><option>Carazo</option></select></div><label class="checkbox-row"><input type="checkbox" required>Acepto los términos y la política de privacidad</label><button type="button" data-action="register" class="btn w100 mt24">Crear cuenta →</button></form><p class="center muted mt16">¿Ya tenés cuenta? <a href="01-login.html" class="link">Iniciar sesión</a></p></main>

<script>/* JS incluido en cada página: GitHub Pages funciona sin backend. Guarda demo en localStorage. */
(function(){
 const STORE='incoex_demo_static_v1';
 const load=()=>{try{return JSON.parse(localStorage.getItem(STORE))||{}}catch(e){return {}}};
 const save=(key,value)=>{const s=load();s[key]=value;localStorage.setItem(STORE,JSON.stringify(s));return s};
 const go=path=>{window.location.href=path};
 const toast=msg=>{const el=document.getElementById('toast');if(!el){alert(msg);return}el.textContent=msg;el.classList.add('show');clearTimeout(window._toastTimer);window._toastTimer=setTimeout(()=>el.classList.remove('show'),3100)};
 const s=load();
 document.querySelectorAll('[data-bind]').forEach(el=>{const key=el.dataset.bind;if(s[key]!==undefined&&s[key]!==null&&s[key]!==''){el.textContent=String(s[key])}});
 document.querySelectorAll('[data-save]').forEach(el=>{const key=el.dataset.save;if(s[key]!==undefined)el.value=s[key];el.addEventListener('input',()=>save(key,el.value));el.addEventListener('change',()=>save(key,el.value))});
 document.querySelectorAll('[data-go]').forEach(el=>el.addEventListener('click',()=>go(el.dataset.go)));
 document.querySelectorAll('[data-back]').forEach(el=>el.addEventListener('click',()=>{if(history.length>1)history.back();else go(el.dataset.back||'03-inicio.html')}));
 document.querySelectorAll('[data-select]').forEach(el=>{const key=el.dataset.select,value=el.dataset.value;if(s[key]===value){el.classList.add('selected');el.setAttribute('aria-pressed','true')}el.addEventListener('click',()=>{document.querySelectorAll('[data-select="'+key+'"]').forEach(item=>{item.classList.remove('selected');item.setAttribute('aria-pressed','false')});el.classList.add('selected');el.setAttribute('aria-pressed','true');save(key,value);document.querySelectorAll('[data-bind="'+key+'"]').forEach(label=>label.textContent=value);if(el.dataset.next)go(el.dataset.next)})});
 document.querySelectorAll('[data-filter]').forEach(el=>el.addEventListener('click',()=>{const filter=el.dataset.filter;document.querySelectorAll('[data-filter]').forEach(b=>b.classList.toggle('on',b===el));document.querySelectorAll('[data-category]').forEach(item=>{item.style.display=(filter==='todos'||filter===item.dataset.category)?'flex':'none'})}));
 document.querySelectorAll('[data-counter]').forEach(el=>el.addEventListener('click',()=>{const key=el.dataset.counter;const delta=Number(el.dataset.delta||1);const num=Math.max(1,Math.min(8,Number(load()[key]||1)+delta));save(key,num);document.querySelectorAll('[data-number="'+key+'"]').forEach(e=>e.textContent=num)}));
 document.querySelectorAll('[data-number]').forEach(el=>{el.textContent=load()[el.dataset.number]||'1'});
 document.querySelectorAll('[data-action]').forEach(el=>el.addEventListener('click',()=>{
   const a=el.dataset.action;
   if(a==='login'){let user=document.querySelector('#correo')?.value||'';let pass=document.querySelector('#clave')?.value||'';if(!user||!pass){toast('Ingresá correo y contraseña para continuar');return}save('email',user);save('name',load().name||user.split('@')[0]);go('03-inicio.html')}
   else if(a==='register'){const name=document.querySelector('#nombre')?.value.trim();const email=document.querySelector('#correo')?.value.trim();const pass=document.querySelector('#clave')?.value||'';if(!name||!email||!pass){toast('Completá los datos obligatorios');return}save('name',name);save('email',email);go('03-inicio.html')}
   else if(a==='require-route'){const t=load();if(!t.pickup||!t.destination){toast('Agregá un punto de recogida y destino');return}go(el.dataset.next||'06-seleccionar-vehiculo.html')}
   else if(a==='request'){const st=load();const trip={date:new Date().toLocaleDateString('es-NI'),from:st.pickup||'Punto de recogida',to:st.destination||'Destino',vehicle:st.vehicle||'Moto',amount:st.total||'C$ 120',status:'En curso'};save('currentTrip',trip);const rides=st.rides||[];rides.unshift(trip);save('rides',rides.slice(0,15));go('13-buscar-conductor.html')}
   else if(a==='finish'){const st=load();const list=st.rides||[];if(list.length){list[0].status='Completado';save('rides',list)}save('tripStatus','Completado');go('16-viaje-finalizado.html')}
   else if(a==='cancel'){save('tripStatus','Cancelado');toast('Solicitud cancelada (demostración)');setTimeout(()=>go('03-inicio.html'),750)}
   else if(a==='logout'){localStorage.removeItem(STORE);go('01-login.html')}
   else if(a==='funds'){const el2=document.querySelector('#monto');const n=Number(el2?.value||0);if(!(n>0)){toast('Ingresá un monto válido');return}save('balance',Number(load().balance||500)+n);toast('Saldo de demostración actualizado');setTimeout(()=>go('19-billetera.html'),550)}
   else if(a==='save-card'){const num=document.querySelector('#tarjeta')?.value||'';if(num.replace(/\D/g,'').length<12){toast('Ingresá un número de tarjeta válido');return}save('cardLast4',num.slice(-4));toast('Tarjeta guardada en este navegador (demo)')}
   else if(a==='support'){toast('Demo: conectá aquí tu chat o servicio de soporte')}
   else if(a==='mapcenter'){toast('Marcador seleccionado: editá la dirección de abajo')}
   else if(a==='favorite'){el.classList.toggle('selected');toast(el.classList.contains('selected')?'Agregado a favoritos':'Quitado de favoritos')}
   else if(a==='notify'){toast('No hay notificaciones nuevas en la demostración')}
   else if(a==='demo'){toast(el.dataset.message||'Esta función requiere conectar tu backend')}
 }));
 document.querySelectorAll('[data-showpass]').forEach(btn=>btn.addEventListener('click',()=>{const inp=document.getElementById(btn.dataset.showpass);inp.type=inp.type==='password'?'text':'password'}));
 document.querySelectorAll('[data-open-trip]').forEach(el=>el.addEventListener('click',()=>{const idx=Number(el.dataset.openTrip);const trip=(load().rides||[])[idx];if(trip){save('pickup',trip.from);save('destination',trip.to);save('vehicle',trip.vehicle);go('11-resumen.html')}else go('11-resumen.html')}));
 const form=document.querySelector('form[data-submit]');if(form){form.addEventListener('submit',ev=>{ev.preventDefault();const action=form.dataset.submit;document.querySelector('[data-action="'+action+'"]')?.click()})}
})();
</script>
</body></html>
